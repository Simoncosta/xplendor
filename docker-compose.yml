services:

  webserver:
    image: nginx:latest
    container_name: xplendor-nginx
    restart: always
    ports:
      - "8001:80"
    volumes:
      - ./docker/nginx/load/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./server:/var/www/html:delegated
      - xplendor_vendor:/var/www/html/vendor
      # Landing Rayo (Next.js exportado estático) — servido na raiz. Read-only.
      - ./site/out:/var/www/site/out:ro
      # App CRA (build de produção) — servida em /app. Read-only.
      - ./web/build:/var/www/web/build:ro
    depends_on:
      - php
      - redis
    networks:
      - xplendor

  db:
    image: mariadb:10.6.11-focal
    container_name: xplendor-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: xplendor
      MYSQL_USER: xplendor
      MYSQL_PASSWORD: xplendor
    volumes:
      - db_data_xplendor:/var/lib/mysql
    ports:
      - "3310:3306"
    restart: always
    networks:
      - xplendor

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: xplendor-phpadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    restart: always
    depends_on:
      - db
    networks:
      - xplendor

  php:
    build:
      context: ./docker/php
    container_name: xplendor-php
    restart: always
    working_dir: /var/www/html
    expose:
      - "9000"
    environment:
      PHP_IDE_CONFIG: "serverName=xplendorDevServer"
      COMPOSER_CACHE_DIR: /tmp/composer
      # Desenvolvimento: os emails vão para o Mailpit (http://localhost:8025), nunca para
      # destinatários reais. Estas variáveis prevalecem sobre o server/.env. Produção: docker-compose.prod.yml.
      MAIL_MAILER: smtp
      MAIL_SCHEME: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./server:/var/www/html:delegated
      - xplendor_vendor:/var/www/html/vendor
      - xplendor_composer_cache:/tmp/composer
      - ./docker/php/conf.d/error_reporting.ini:/usr/local/etc/php/conf.d/error_reporting.ini:ro
      - ./docker/php/conf.d/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      - db
      - redis
    networks:
      - xplendor

  # Carteiro de testes (só no desenvolvimento): recebe todos os emails da app.
  # Caixa em http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: xplendor-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - xplendor

  # R2 em dev: um MinIO (compatível com S3) para testar o disco de ficheiros de ponta a ponta.
  # SÓ em dev (nunca no docker-compose.prod.yml): em produção, o disco é o Cloudflare R2.
  # Consola em http://localhost:9011 (minioadmin / minioadmin). O bucket privado é criado
  # pelo serviço minio-setup.
  minio:
    # A imagem já está em cache nesta máquina; o Docker Hub deixou de servir as versões fixas do MinIO.
    image: minio/minio:latest
    pull_policy: missing
    container_name: xplendor-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data
    networks:
      - xplendor

  minio-setup:
    image: minio/mc:latest
    pull_policy: missing
    container_name: xplendor-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/xplendor-media;
      mc anonymous set none local/xplendor-media;
      echo bucket privado pronto"
    networks:
      - xplendor

  redis:
    image: redis:alpine
    container_name: xplendor-redis
    restart: always
    volumes:
      - ./docker/redis/db:/data
    ports:
      - "6382:6379"
    networks:
      - xplendor

  scheduler:
    build:
      context: ./docker/php
    container_name: xplendor-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    entrypoint: []
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    environment:
      # Desenvolvimento: os emails vão para o Mailpit (http://localhost:8025), nunca para
      # destinatários reais. Estas variáveis prevalecem sobre o server/.env. Produção: docker-compose.prod.yml.
      MAIL_MAILER: smtp
      MAIL_SCHEME: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
    volumes:
      - ./server:/var/www/html:delegated
      - xplendor_vendor:/var/www/html/vendor
      - xplendor_composer_cache:/tmp/composer
    depends_on:
      - db
      - redis
    networks:
      - xplendor

  worker:
    build:
      context: ./docker/php
    container_name: xplendor-worker
    restart: unless-stopped
    working_dir: /var/www/html
    entrypoint: []
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      # Desenvolvimento: os emails vão para o Mailpit (http://localhost:8025), nunca para
      # destinatários reais. Estas variáveis prevalecem sobre o server/.env. Produção: docker-compose.prod.yml.
      MAIL_MAILER: smtp
      MAIL_SCHEME: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
    volumes:
      - ./server:/var/www/html:delegated
      - xplendor_vendor:/var/www/html/vendor
      - xplendor_composer_cache:/tmp/composer
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - db
      - redis
      - scraper
    networks:
      - xplendor

  scraper:
    build:
      context: .
      dockerfile: docker/scraper/Dockerfile
    container_name: xplendor-scraper
    restart: unless-stopped
    volumes:
      - ./scraper:/scraper
      - ./docker/scraper:/app
    networks:
      - xplendor

networks:
  xplendor: {}

volumes:
  minio_data:
  db_data_xplendor:
  xplendor_vendor:
  xplendor_composer_cache:
