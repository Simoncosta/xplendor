services:
  webserver:
    image: nginx:latest
    container_name: xplendor-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/prod/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./server:/var/www/html:ro
      - ./web/build:/var/www/web/build:ro
      # Landing Rayo (Next.js exportado estático) — servida na raiz. Read-only.
      - ./site/out:/var/www/site/out:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - php
      - redis
    networks:
      - xplendor

  php:
    build:
      context: ./docker/php
    container_name: xplendor-php
    restart: always
    working_dir: /var/www/html
    expose:
      - "9000"
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer
      APP_ENV: production
      # Variável real do contentor: ganha ao server/.env (o Laravel não a
      # sobrescreve). Em produção nunca mostrar exception/file/trace.
      APP_DEBUG: "false"
    volumes:
      - ./server:/var/www/html:delegated
      - xplendor_vendor:/var/www/html/vendor
      - xplendor_composer_cache:/tmp/composer
      - ./docker/php/conf.d/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./docker/php/conf.d/error_reporting.ini:/usr/local/etc/php/conf.d/error_reporting.ini:ro
    depends_on:
      - db
      - redis
    networks:
      - xplendor

  db:
    image: mariadb:10.6.11-focal
    container_name: xplendor-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: xplendor
      MYSQL_USER: xplendor_admin
      MYSQL_PASSWORD: 83a3dYSt7MbmeJ2l
    volumes:
      - db_data_xplendor:/var/lib/mysql
    # Só no próprio servidor (127.0.0.1): de fora, por túnel SSH. Os contentores usam "db:3306".
    ports:
      - "127.0.0.1:3310:3306"
    restart: always
    networks:
      - xplendor

  redis:
    image: redis:alpine
    container_name: xplendor-redis
    restart: always
    volumes:
      - redis_data_xplendor:/data
    ports:
      - "127.0.0.1:6381:6379"
    networks:
      - xplendor

  # phpMyAdmin: não arranca por omissão (profile "admin") nem volta sozinho depois de reiniciar o
  # servidor; quando arranca, só em 127.0.0.1 (acesso por túnel SSH). Arrancar e parar:
  #   docker compose -f docker-compose.prod.yml --profile admin up -d phpmyadmin
  #   docker compose -f docker-compose.prod.yml --profile admin stop phpmyadmin
  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    container_name: xplendor-phpadmin
    profiles: ["admin"]
    restart: "no"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: 83a3dYSt7MbmeJ2l
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - db
    networks:
      - xplendor

  scheduler:
    build:
      context: ./docker/php
    container_name: xplendor-scheduler
    restart: always
    working_dir: /var/www/html
    entrypoint: []
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - ./server:/var/www/html:delegated
      - xplendor_vendor:/var/www/html/vendor
      - xplendor_composer_cache:/tmp/composer
    depends_on:
      - db
      - redis
    networks:
      - xplendor

  worker:
    build:
      context: ./docker/php
    container_name: xplendor-worker
    restart: always
    working_dir: /var/www/html
    entrypoint: []
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - ./server:/var/www/html:delegated
      - xplendor_vendor:/var/www/html/vendor
      - xplendor_composer_cache:/tmp/composer
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - db
      - redis
      - scraper
    networks:
      - xplendor

  # E-mail 3: um segundo worker só para a fila mail (o envio pelas caixas de correio e os não lidos),
  # para a leitura não ficar atrás dos jobs longos da fila por omissão.
  worker-mail:
    build:
      context: ./docker/php
    container_name: xplendor-worker-mail
    restart: always
    working_dir: /var/www/html
    entrypoint: []
    command: php artisan queue:work --queue=mail --sleep=3 --tries=1 --max-time=3600
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - ./server:/var/www/html:delegated
      - xplendor_vendor:/var/www/html/vendor
      - xplendor_composer_cache:/tmp/composer
    depends_on:
      - db
      - redis
    networks:
      - xplendor

  scraper:
    build:
      context: .
      dockerfile: docker/scraper/Dockerfile
    container_name: xplendor-scraper
    restart: unless-stopped
    volumes:
      - ./scraper:/scraper
      - ./docker/scraper:/app
    networks:
      - xplendor

  # Antivírus dos documentos de financiamento (ficheiros que chegam do público). Só na rede
  # interna (o php e o worker falam com "clamav:3310"); nenhuma porta publicada no anfitrião
  # (a 3310 do anfitrião é da MariaDB). As assinaturas ficam no volume clamav_db (o primeiro
  # arranque descarrega-as dos servidores oficiais do ClamAV; depois o freshclam só atualiza).
  # Limite de memória: 3 GB (as assinaturas ocupam cerca de 1,2 GB e o dobro durante a
  # recarga em paralelo), para nunca tirar memória à base de dados.
  clamav:
    image: clamav/clamav:1.5.4_base-debian13-slim
    container_name: xplendor-clamav
    restart: unless-stopped
    environment:
      # Segundos à espera do clamd depois de as assinaturas estarem no disco (carregá-las leva
      # um a dois minutos numa máquina pequena). O healthcheck é o da imagem (clamdcheck.sh,
      # 6 minutos de arranque).
      CLAMD_STARTUP_TIMEOUT: "900"
    volumes:
      - clamav_db:/var/lib/clamav
      - ./docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    mem_limit: 3g
    memswap_limit: 3g
    networks:
      - xplendor

networks:
  xplendor: {}

volumes:
  clamav_db:
  db_data_xplendor:
  redis_data_xplendor:
  xplendor_vendor:
  xplendor_composer_cache:
