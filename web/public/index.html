  <!-- Tema escolhido (claro ou escuro): aplicado ANTES de a app carregar, para não piscar em
       claro depois de atualizar a página. Sem acesso ao armazenamento, vale o claro. -->
  <script>
    (function () {
      try {
        var t = window.localStorage.getItem('xp-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-bs-theme', t);
          if (t === 'dark') document.documentElement.setAttribute('data-sidebar', 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    html[data-bs-theme="dark"], html[data-bs-theme="dark"] body { background-color: #1a1d21; color-scheme: dark; }
  </style>

  <!-- Recuperação depois de um deploy: se um ficheiro do build não carregar (um index.html antigo,
       em cache, a pedir um main.js que já não existe, ou o servidor a responder com HTML), remove
       o service worker e as caches e recarrega UMA vez. A marca no sessionStorage impede ciclos:
       não volta a tentar durante 1 minuto e, sem armazenamento, não recarrega. -->
  <script>
    (function () {
      var KEY = 'xp-recover-at';
      function failedBuildFile(e) {
        var t = e.target;
        if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) return /\/static\//.test(t.src || t.href || '');
        return /\/static\/js\//.test(e.filename || '') && /Unexpected token/.test(e.message || '');
      }
      window.addEventListener('error', function (e) {
        if (!failedBuildFile(e)) return;
        var now = Date.now();
        try {
          if (now - Number(window.sessionStorage.getItem(KEY) || 0) < 60000) return;
          window.sessionStorage.setItem(KEY, String(now));
          if (window.sessionStorage.getItem(KEY) !== String(now)) return;
        } catch (x) { return; }
        var jobs = [];
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }));
        }
        if (window.caches && window.caches.keys) {
          jobs.push(window.caches.keys().then(function (ks) {
            return Promise.all(ks.map(function (k) { return window.caches.delete(k); }));
          }));
        }
        var reload = function () { window.location.reload(); };
        Promise.all(jobs).then(reload, reload);
      }, true);
    })();
  </script>

  <!-- Google Consent Mode v2 — default DENIED até consentimento -->

  <!-- Google tag (gtag.js), GA4. Nunca nas páginas públicas (orçamento, aprovação, cobrança e
       configuração): não usam cookies nem análise de terceiros (como o aviso de cookies em App.tsx). -->
  <script>
    (function () {
      if (/\/(orcamento|aprovar|cobranca|configurar)\//.test(window.location.pathname + '/')) return;
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-KMK84KG99K';
      document.head.appendChild(s);
      gtag('js', new Date());
      gtag('config', 'G-KMK84KG99K');
    })();
  </script>
