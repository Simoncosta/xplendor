# ClamAV (clamd) dos documentos de financiamento: a configuração da imagem oficial
# (clamav/clamav:1.5.4_base-debian13-slim) com o que a XPLENDOR precisa, montada só de leitura
# nos dois compose (dev e produção).

LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
# Só na rede interna do Docker (o php e o worker): a porta nunca é publicada no anfitrião.
TCPSocket 3310
User clamav

# Os ficheiros chegam por INSTREAM, até 10 MB (config/financing.php: max_file_bytes). 16 MB dão
# margem; um ficheiro maior é recusado pelo clamd (e a análise fica por fazer, nunca "limpa").
StreamMaxLength 16M

# Recarregar as assinaturas em paralelo (o valor por omissão, aqui explícito): as análises nunca
# esperam durante a atualização; o pico de memória (duas bases em memória durante uns segundos)
# cabe no limite do contentor (3 GB no compose).
ConcurrentDatabaseReload yes
