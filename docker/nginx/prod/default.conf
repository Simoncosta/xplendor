# -----------------------------------
# HTTP → redireciona para HTTPS
# -----------------------------------
server {
    listen 80;
    server_name xplendor.tech www.xplendor.tech;

    return 301 https://$host$request_uri;
}

# -----------------------------------
# HTTPS
# -----------------------------------
server {
    listen 443 ssl;
    server_name xplendor.tech www.xplendor.tech;

    ssl_certificate /etc/letsencrypt/live/xplendor.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xplendor.tech/privkey.pem;

    client_max_body_size 700M;

    # -------------------------
    # Compressão gzip (HTML, CSS, JS, SVG, JSON e texto). O HTML é sempre comprimido
    # com gzip on; os restantes tipos vêm em gzip_types.
    # -------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/manifest+json image/svg+xml;

    # =========================================================================
    # LAYOUT: RAIZ = landing Rayo (estático, site/out) · APP CRA = /app · Laravel intacto
    # =========================================================================

    # -------------------------
    # Widget embed (Laravel) — INTACTO
    # -------------------------
    location = /xplendor.js {
        root /var/www/html/public;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=300";
        try_files /xplendor.js =404;
    }

    # -------------------------
    # App CRA em /app (SPA). ^~ tem prioridade sobre os regex → serve os assets do CRA
    # (/app/static/…) e faz fallback ao index do SPA nas rotas profundas (F5).
    # -------------------------
    location = /app { return 301 /app/; }
    location ^~ /app/ {
        alias /var/www/web/build/;
        try_files $uri /app/index.html;
    }

    # -------------------------
    # REDIRECT dos relatórios públicos /r/:token → /app/r/:token
    # A raiz passou a ser o Rayo; os links /r/ já partilhados apontavam para a app antiga.
    # $request_uri preserva o resto do caminho e a query.
    # -------------------------
    location ^~ /r/ {
        return 301 /app$request_uri;
    }

    # -------------------------
    # STORAGE público (Laravel) — INTACTO
    # -------------------------
    location ^~ /storage/ {
        alias /var/www/html/public/storage/;

        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # -------------------------
    # API Laravel — INTACTO
    # -------------------------
    location ^~ /api/ {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/html/public;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
    }

    # -------------------------
    # Landing Rayo (Next.js exportado ESTÁTICO) na RAIZ
    # -------------------------
    root /var/www/site/out;
    index index.html;

    # Cache de assets estáticos (Rayo: /_next/…, imagens da raiz).
    # NOTA: os assets do CRA estão sob /app/ (^~) e nunca caem aqui.
    location ~* \.(css|js|jpg|jpeg|png|webp|avif|gif|svg|ico|woff|woff2)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Páginas do Rayo (export com trailingSlash → dir/index.html). Um URL que não existe
    # devolve 404 real com a página 404.html do export (antes devolvia a home com 200).
    # Só neste bloco da landing: /app mantém o fallback para /app/index.html e /api não muda.
    # robots.txt, sitemap.xml e llms.txt são ficheiros do export e são servidos aqui.
    location / {
        charset utf-8;
        try_files $uri $uri/index.html =404;
        error_page 404 /404.html;
    }

    location = /404.html {
        internal;
    }
}
