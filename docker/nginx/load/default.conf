server {
    listen 80;
    server_name localhost;

    client_max_body_size 700M;
    # Location relativo nos redirects (ex.: /app → /app/) para não perder host:porta em DEV.
    absolute_redirect off;

    # ── App CRA em /app (SPA). ^~ garante prioridade sobre o regex .php e serve os
    #    assets do CRA (/app/static/…). alias → o build; try_files → index do SPA. ──
    location = /app { return 301 /app/; }
    location ^~ /app/ {
        alias /var/www/web/build/;
        try_files $uri /app/index.html;
    }

    # ── Laravel: API + front controller (INTACTO). ──
    location ^~ /api/ {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
    }

    # Uploads/imagens do Laravel.
    location ^~ /storage/ {
        alias /var/www/html/public/storage/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Widget embed servido pelo Laravel.
    location = /xplendor.js {
        root /var/www/html/public;
        expires 300s;
    }

    # ── Landing Rayo (Next.js exportado ESTÁTICO) na RAIZ. ──
    root /var/www/site/out;
    index index.html;

    location / {
        try_files $uri $uri/index.html /index.html;
    }

    sendfile on;
}
